; Revenant Revisited settings, read with --revisited (revisited_settings.cpp).
; Keys left out keep the engine's defaults (SRevisitedSettings).
;
; The modern lighting model starts from retail's own light levels and adds
; form: the values below were fitted against the retail game at every
; AREA.DEF location (docs/lighting/LIGHTING_AB.md §6.4, variant h2).

[Revisited]
; 0 = Classic (retail's lighting, exactly), 1 = modern
LightingMode = 1

; Ambient: retail's tile ambient (AMBLIGHT, AMBCOLOR) times this
AmbientScale = 0.85
; By day the sun takes this share of the ambient over and gives it back on
; faces turned to it (areas with day and night)
SunShare = 0.5
SunIntensity = 1

; One scale for tiles and 3D objects: a tile pixel is its surface's
; reflectance times the light baked into the art
TileBakedLevel = 0.35
; The tone curve's knee, shared by tiles and 3D objects (1 = hard clip)
ToneShoulder = 0.8

; 3D objects: retail's own 3D lighting (ambient + key light) ...
CharacterRetailLight = 1
; ... plus this share of the light the tile under them gets,
CharacterLightBoost = 0.25
; shaped by retail's key-light direction (0 = flat),
CharacterKeyLight = 0.5
; keeping this much of that light's colour (1 = all)
CharacterLightSaturation = 0.5
