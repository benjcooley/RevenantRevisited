; Revenant Revisited settings, read with --revisited (revisited_settings.cpp).
; Keys left out keep the engine's defaults (SRevisitedSettings).
;
; The modern lighting model starts from retail's own light levels and adds
; form: the values below were fitted against the retail game at every
; AREA.DEF location (docs/lighting/LIGHTING_AB.md §6.4, variant h2).

[Revisited]
; 0 = Classic (retail's lighting, exactly), 1 = modern
LightingMode = 1

; Ambient: retail's tile ambient (AMBLIGHT, AMBCOLOR) times this
AmbientScale = 0.85
; By day the sun takes this share of the ambient over and gives it back on
; faces turned to it (areas with day and night)
SunShare = 0.5
SunIntensity = 1

; One scale for tiles and 3D objects: a tile pixel is its surface's
; reflectance times the light baked into the art
TileBakedLevel = 0.35
; The tone curve's knee, shared by tiles and 3D objects (1 = hard clip)
ToneShoulder = 0.8

; 3D objects: retail's own 3D lighting (ambient + key light) ...
CharacterRetailLight = 1
; ... plus this share of the light the tile under them gets,
CharacterLightBoost = 0.25
; shaped by retail's key-light direction (0 = flat),
CharacterKeyLight = 0.5
; keeping this much of that light's colour (1 = all)
CharacterLightSaturation = 0.5


; High-res tile art (tiletexoverride.cpp): swap a tile's colour for matching
; upscaled art from a local tree, names "<NNNN>_<Name>.png" exactly as
; --dumptiles writes them; files under a Final/ folder win. The art's own
; alpha is the tile's cutout, retail's depth stays the relief, so only the
; albedo changes.
HighResTiles = 1
; Tile art tree, names '<NNNN>_<Name>.png' as --dumptiles writes them.
; Empty = the standard folder: <overlay>/Imagery (revisited/resources/Imagery
; in the dev layout). The debug panel's Sprites tab edits it live.
HighResTileRoot =

; Sprite art (spritetexoverride.cpp): swap a sprite's texture for matching
; PNG art from a local tree, laid out the way --dumpi3d writes it:
;   <SpriteRoot>/<subdir>/<name>/texture_<NN>_frame_<NN>.png
; e.g. SpriteRoot/Chars/locke/texture_00_frame_00.png
; The art has to have the retail texture's size. SpriteMode picks what the
; game shows: 0 = retail, 1 = modern (the tree). The debug panel's Map tab
; (F10) has a "Sprites" sub-tab that switches it and reloads the sprites.
SpriteOverride = 1
; Sprite art tree. Empty = the standard folder: <overlay>/Sprites
; (revisited/resources/Sprites in the dev layout). The debug panel's
; Sprites tab edits it live.
SpriteRoot =
SpriteMode = 0

AOEnable = 1
SunShadow = 1
