name: Rust platforms

on:
  push:
    paths: ['rust/**', 'src/mappane.cpp', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', 'src/mappane.cpp', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt
      - name: Linux window, audio and Vulkan dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libvulkan1 mesa-vulkan-drivers xvfb xauth weston
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --no-default-features
      - name: Compare terrain collision with the C++ engine
        if: runner.os != 'Windows'
        run: cargo test --locked --test walkmap_reference -- --ignored
      - name: Vulkan shaders and X11/Wayland presentation regressions
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          REVENANT_TEST_GPU_FALLBACK: '1'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/revenant-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cargo test --locked --test gpu -- --ignored --test-threads=1
          xvfb-run -a cargo run --locked --example gpu-smoke
          sh ci/smoke-wayland.sh
      - name: DirectX 12 shader regressions on WARP
        if: runner.os == 'Windows'
        env:
          WGPU_BACKEND: dx12
          REVENANT_TEST_GPU_FALLBACK: '1'
        run: cargo test --locked --test gpu -- --ignored --test-threads=1
      - run: cargo build --locked --release
      - name: Package native executable without game assets
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/revenant.exe dist/
          else
            cp target/release/revenant dist/
          fi
          cp README.md dist/
          tar -czf "revenant-rust-$RUNNER_OS-$RUNNER_ARCH.tar.gz" -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: revenant-rust-${{ runner.os }}-${{ runner.arch }}
          path: rust/revenant-rust-*.tar.gz
          if-no-files-found: error
