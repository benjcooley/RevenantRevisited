# (Supersedes the demoted "cls_0x5a47f0 = TLightningAnimator" mapping —
# extraction pass 2 confirms cls_0x5a47f0 is the slim TEffect base.)
source_class: "TEffect"
ghidra_class: "cls_0x5a47f0"
confidence: "MEDIUM-HIGH"

# Evidence:
#   - cls_0x5a47f0 is a 60-byte structure with vftable_5a47f0, allocated
#     fresh by EVERY confirmed leaf effect class's virtual creator (the
#     covariant return type of `cls_0x5a47f0 *` from each leaf's CreateInstance
#     pattern). This is the classic TEffect base pattern.
#   - cls_0x5a47f0 ctor (at 0x445940) signature:
#         cls_0x5a47f0 *__thiscall(cls_0x5a47f0 *this, TCharacter *owner)
#     and it stores the TCharacter * at mbr_0x4 and calls
#     TCharacter::meth_0x46e8a0 to seed mbr_0x8. This matches the
#     TEffect(TCharacter *) idiom in pre-release source: every TEffect owns
#     a back-pointer to its character + a cached imagery handle.
#   - Init state in ctor:
#         mbr_0x4  = owner_TCharacter
#         mbr_0x8  = owner->meth_0x46e8a0()    (likely owner->imagery cache)
#         mbr_0xc  = 0
#         mbr_0x10 = -1                         (sound channel?)
#         mbr_0x14 = 0
#         mbr_0x18 = -1                         (frame/anim ID?)
#         mbr_0x1c = 1                          (active=true)
#         mbr_0x20..0x30 = 0
#         mbr_0x34, 0x35 = 0  (bytes — flags)
#         mbr_0x2c = 1
#         mbr_0x38 = 0
#   - Dtor at 0x448380: deletes mbr_0x38 (heap-owned sub-buffer) — typical
#     of TEffect's optional dynamic per-instance state.
#   - Used as the BASE in every leaf effect's creator: each leaf class
#     allocates its own size (0x100..0x578), constructs as cls_0x5a47f0
#     via cls_0x5a47f0::cls_0x5a47f0(this_00), then patches the vftable
#     pointer to the leaf's own.
#
# Caveats / future work:
#   - Ghidra reports Length: 60, but leaf classes' allocations are 0x100+;
#     so the 60-byte view is the slim vftable+state-only view. The wider
#     "TEffect + TObjectInstance" composite layout would explain the
#     larger sizes — but at this point cls_0x5a47f0 is unambiguously the
#     TEffect-base vftable+ctor entry.
#   - Source-side TEffect declaration in src/effect.h should be diffed
#     against this layout to confirm member order. Until done, keep as
#     MEDIUM-HIGH (not confirmed).
#   - cls_0x5b0074, cls_0x5a7e38 may be intermediate bases (TObjectInstance
#     and possibly a TAnimatedObjectInstance) — both have spurious "Length"
#     in the thousands due to Ghidra absorbing concatenated free functions.
#     Treat as fuzzy until vtable shape is reconciled.

